[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acd_auto_export"]

[project]
name = "acd-auto-export"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "logix-designer-sdk",
    "watchdog>=6.0.0",
]

[project.scripts]
acd-auto-export = "acd_auto_export.cli:main"

[tool.uv.sources]
logix-designer-sdk = { path = "vendor/logix_designer_sdk-2.0.1-py3-none-any.whl" }
